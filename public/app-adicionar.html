<html>
  <head>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <a class="button-link user" href="/app-menu.html">Voltar</a>
    <h2>Adição de dispositivos:</h2>

    <label>Apelido:</label>
    <input id="apelido" />
    <br />
    <label>Unidade:</label>
    <input id="unidade" />
    <br />

    <button onclick="insere()">ADICIONAR</button>
    <div id="resultado" style="margin-top: 20px; word-break: break-all">
      <strong>DeviceID:</strong>
      <span id="deviceID">Aguardando...</span>
      <strong>DevicePWD:</strong>
      <span id="devicePWD">Aguardando...</span>
    </div>
    <script>
      async function insere() {
        const emailLogado = localStorage.getItem("usuario_email");

        if (!emailLogado) {
          alert("Você precisa estar logado.");
          return;
        }

        let registro = {};
        registro.email = emailLogado;
        registro.apelido = document.getElementById("apelido").value;
        registro.unidade = document.getElementById("unidade").value;

        const res = await fetch("/dispositivos", {
          method: "POST",
          headers: {
            //Accept: "application/json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify(registro), //string formatada em json
        });
        if (res.ok) {
          const resultado = await res.json();

          if (resultado.deviceID && resultado.devicePWD) {
            // Exibe o token na tela
            document.getElementById("deviceID").innerText = resultado.deviceID;
            document.getElementById("devicePWD").innerText =
              resultado.devicePWD;
          }
          //alert("Dispositivo adicionado com sucesso");

          document.getElementById("apelido").value = "";
          document.getElementById("unidade").value = "";
        }
      }
    </script>
  </body>
</html>
