<html>
  <head>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!-- <a class="button-link user" href="/">Voltar</a> -->
    <h2>Lista de dispositivos:</h2>

    <div id="lista"></div>
    <script>
      async function pegaDados() {
        const emailLogado = localStorage.getItem("usuario_email");

        if (!emailLogado) {
          alert("Você precisa estar logado.");
          return;
        }
        let listagem = await fetch(`/lista?email=${emailLogado}`);
        listagem = await listagem.json();
        console.log(listagem);

        let tmp = "";
        for (let a = 0; a < listagem.length; a++) {
          tmp =
            tmp +
            `<div class="dispositivo-item">
              <b>Apelido:</b> ${listagem[a].apelido}, 
              <b>Unidade:</b> ${listagem[a].unidade}, 
              <b>Valor:</b> ${
                listagem[a].valor !== null ? listagem[a].valor : "--"
              }, <br><br>
              <b>DeviceID:</b> ${listagem[a].deviceID}
              <b>DevicePWD:</b> ${listagem[a].devicePWD}
            </div><br>`;
        }
        document.getElementById("lista").innerHTML = tmp;
      }

      pegaDados();

      setInterval(pegaDados, 3000);
    </script>
  </body>
</html>
